<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 475" width="700" height="475" role="img" aria-label="A palm tree on a small beach beside a coconut wearing a padlock">
  <!-- Buko Technologies illustration. Colors match css/buko-theme.css. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fbc2cc"/>
      <stop offset="55%" stop-color="#fba4b4"/>
      <stop offset="100%" stop-color="#f98da4"/>
    </linearGradient>
  </defs>

  <rect width="700" height="475" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="562" cy="104" r="46" fill="#ffffff" opacity="0.34"/>
  <circle cx="562" cy="104" r="30" fill="#ffffff" opacity="0.42"/>

  <!-- sand -->
  <ellipse cx="350" cy="418" rx="252" ry="46" fill="#f5dfb0"/>
  <ellipse cx="350" cy="410" rx="188" ry="30" fill="#fceccb"/>

  <!-- palm trunk -->
  <path d="M296 408 C 300 330, 306 258, 336 190" fill="none" stroke="#d9a95f" stroke-width="21" stroke-linecap="round"/>
  <path d="M296 408 C 300 330, 306 258, 336 190" fill="none" stroke="#c08f4a" stroke-width="7" stroke-linecap="round" opacity="0.45" stroke-dasharray="3 22"/>

  <!-- fronds -->
  <g fill="#2e9e4f">
    <path d="M338 184 C 288 140, 224 138, 190 168 C 236 168, 296 172, 338 196 Z"/>
    <path d="M338 184 C 322 126, 348  76, 396  62 C 372 104, 358 146, 350 190 Z"/>
  </g>
  <g fill="#7bc950">
    <path d="M338 184 C 392 142, 458 148, 486 182 C 440 172, 382 176, 344 196 Z"/>
    <path d="M338 184 C 296 108, 240  86, 202  92 C 250 118, 300 148, 334 192 Z"/>
    <path d="M338 184 C 400 190, 452 232, 458 272 C 424 236, 378 206, 342 196 Z"/>
  </g>
  <circle cx="338" cy="186" r="12" fill="#24803e"/>

  <!-- coconut -->
  <circle cx="452" cy="374" r="49" fill="#8b5e3c"/>
  <circle cx="452" cy="374" r="49" fill="none" stroke="#6f4a2e" stroke-width="4"/>
  <ellipse cx="434" cy="356" rx="15" ry="11" fill="#a3714b" opacity="0.75"/>

  <!-- padlock badge on the coconut -->
  <rect x="430" y="372" width="44" height="32" rx="8" fill="#ffffff"/>
  <path d="M439 372 v-9 a13 13 0 0 1 26 0 v9" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="452" cy="386" r="5" fill="#e05570"/>
  <path d="M452 389 v6" stroke="#e05570" stroke-width="4" stroke-linecap="round"/>

  <!-- little coconut on the sand -->
  <circle cx="214" cy="404" r="22" fill="#8b5e3c"/>
  <ellipse cx="207" cy="396" rx="7" ry="5" fill="#a3714b" opacity="0.75"/>
</svg>
